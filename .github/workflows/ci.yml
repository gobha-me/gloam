name: CI

# Enforces the AGENTS.md rule: "build on both compilers, always." Every push to
# main and every pull request builds + tests the project on GCC and Clang across
# the default toolchain and each sanitizer, so a change that only builds on one
# compiler fails visibly.
#
# This is the cpp-template family's reference workflow: it hardcodes nothing
# project-specific. The project name is derived from the checkout directory
# (see root CMakeLists.txt), so a fork copies this file verbatim. The fork-side
# steps — including the README badge slug — are listed in NEW_PROJECT.md.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04   # ships GCC 13 + Clang (both C++23-capable); pinned for reproducibility
    strategy:
      fail-fast: false      # always show every compiler's result, not just the first failure
      matrix:
        include:
          - { name: "gcc / default",   cxx: g++,     toolchain: default.cmake,   build_type: Debug }
          - { name: "gcc / asan",      cxx: g++,     toolchain: address.cmake,   build_type: Debug }
          - { name: "gcc / tsan",      cxx: g++,     toolchain: thread.cmake,    build_type: RelWithDebInfo }
          - { name: "gcc / ubsan",     cxx: g++,     toolchain: undefined.cmake, build_type: Debug }
          - { name: "clang / default", cxx: clang++, toolchain: clang.cmake,     build_type: Debug }
          - { name: "clang / asan",    cxx: clang++, toolchain: address.cmake,   build_type: Debug }
          - { name: "clang / tsan",    cxx: clang++, toolchain: thread.cmake,    build_type: RelWithDebInfo }
          - { name: "clang / ubsan",   cxx: clang++, toolchain: undefined.cmake, build_type: Debug }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0    # full history + tags so cmake/version.cmake's `git describe --tags` resolves a real version

      # GCC jobs use the preinstalled g++ (13). The clang jobs, however, must NOT
      # use ubuntu-24.04's stock clang 18: its libstdc++ pairing cannot compile
      # the C++23 std::expected example (test/20failure-testing) — the same class
      # of compiler/stdlib break as the documented fmt-under-clang-20 issue. Pin
      # them to a known-good Clang so "both compilers, always" stays honest. The
      # symlinks make `clang++` resolve to the pinned version, so clang.cmake's
      # find_program(clang++) and the sanitizer toolchains' $CXX all pick it up.
      - name: Install Clang
        if: ${{ startsWith(matrix.cxx, 'clang') }}
        env:
          CLANG_VERSION: "20"
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$CLANG_VERSION"
          sudo ln -sf "/usr/bin/clang-$CLANG_VERSION"   /usr/local/bin/clang
          sudo ln -sf "/usr/bin/clang++-$CLANG_VERSION" /usr/local/bin/clang++
          clang++ --version

      # SPEC §9.2's output stream. cmake/deps/rtaudio.cmake builds RtAudio's ALSA
      # backend and nothing else, so it needs the headers; ubuntu-24.04 ships
      # libasound2t64 (the runtime) but not the -dev package.
      #
      # HEADERS ONLY, AND THE RUNNER STILL HAS NO /dev/snd — which is the point
      # rather than a limitation. The whole audio slice is written to degrade
      # instead of crash on exactly this machine, and `audio-no-device-degrades`
      # is the ctest case that proves it here, on every leg. Building RtAudio on
      # all eight is deliberate too: it is the only third-party code in the tree,
      # and this is the one chance to put both compilers and four sanitizers over
      # it. The real-time path is never entered — open() bails at an empty
      # getDeviceIds() before a stream thread exists — so the sanitizers audit
      # GLOAM's code rather than ALSA's.
      - name: Install ALSA headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev

      - name: Configure
        env:
          CXX: ${{ matrix.cxx }}   # default/sanitizer toolchains respect $CXX; clang.cmake selects clang itself
        run: >
          cmake -B build
          -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain/${{ matrix.toolchain }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        # Runs the Catch2 suites, the sanitizer engagement smoke test, and the
        # CT-05 version-parse-selftest.
        run: ctest --test-dir build --output-on-failure

  # NOTE: the starter's "library disabled" job lived here and has been removed.
  #
  # It proved that -D<name>_BUILD_LIB=OFF stayed a supported configuration:
  # the library target vanishes, the executable still builds, and the install
  # rules do not deposit a Config.cmake with no Targets.cmake beside it.
  #
  # GLOAM has no such configuration. src/bin/ is a thin consumer of the
  # simulation core, so a build without the library produces a link error
  # rather than an application, and src/lib/CMakeLists.txt drops the option
  # entirely. There is nothing left for the job to assert.
  #
  # If the executable ever becomes independent of the library, restore both
  # the option and this job together — they only mean anything as a pair.


  # The consuming-project path, which nothing else here covers: every job above
  # builds this repo as the top-level project, so a regression in the
  # PROJECT_IS_TOP_LEVEL guards, the install/export rules or the public usage
  # requirements would go unnoticed until a downstream project hit it.
  #
  # example/consumer/verify.sh builds a miniature downstream project three ways —
  # add_subdirectory, FetchContent, and an installed find_package — and runs the
  # result each time. Both compilers, because a usage requirement can propagate
  # on one and not the other.
  consumer:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "consumer / gcc",   cxx: g++ }
          - { name: "consumer / clang", cxx: clang++ }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Same pin and rationale as the build matrix above.
      - name: Install Clang
        if: ${{ startsWith(matrix.cxx, 'clang') }}
        env:
          CLANG_VERSION: "20"
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$CLANG_VERSION"
          sudo ln -sf "/usr/bin/clang-$CLANG_VERSION"   /usr/local/bin/clang
          sudo ln -sf "/usr/bin/clang++-$CLANG_VERSION" /usr/local/bin/clang++

      - name: Consume the library three ways
        env:
          CXX: ${{ matrix.cxx }}
        run: example/consumer/verify.sh

  # The one path this project cannot exercise as itself: a fork whose library
  # links a FetchContent'd dependency into its own exported interface. Our
  # library links nothing, so the harness synthesises such a fork and asserts
  # that the install/export files survive being copied into it (#29).
  #
  # One compiler on purpose. The failure this guards against happens during
  # CMake generation, before a translation unit is compiled, so a matrix would
  # buy nothing; the per-compiler half of consuming this project is already
  # covered by the two jobs above. Its own job rather than a step in those, so a
  # red check names the cause without opening a log.
  public-dep:
    name: public dependency
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Consume a fork that has a public dependency
        run: example/public-dep/verify.sh

  # Fast, dependency-free guard: the git-describe version parser self-test on its
  # own (no compiler, no network). It also runs inside every build job above via
  # ctest; this job gives quick, isolated feedback.
  version-selftest:
    name: version parser self-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Run version_selftest.cmake
        run: cmake -P cmake/version_selftest.cmake
